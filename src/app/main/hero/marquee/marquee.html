<div class="marquee" aria-label="Professional highlights">
    <div class="marquee__inner">
        <div class="marquee__track">
            @for (key of textKeys; track $index) {
            <span class="marquee__item">{{ key | transloco }}</span>
            <span class="marquee__sep" aria-hidden="true"></span>
            }
        </div>
        <div class="marquee__track" aria-hidden="true">
            @for (key of textKeys; track $index) {
            <span class="marquee__item">{{ key | transloco }}</span>
            <span class="marquee__sep" aria-hidden="true"></span>
            }
        </div>
    </div>
</div>
